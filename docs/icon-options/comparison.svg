<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="680" viewBox="0 0 1200 680">
  <title>Aerospace Gestures — four icon concepts</title>
  <desc>Four equal-weight concepts with large artwork and monochrome previews at 16, 22, and 32 pixels.</desc>
  <defs>
    <symbol id="swipe" viewBox="0 0 256 256">
      <g fill="none" stroke="currentColor" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
        <path d="M55 83H105Q141 83 161 59L181 39M55 136H111Q147 136 171 112L214 69M179 69H214V104M55 189H115Q151 189 176 164L199 141"/>
      </g>
    </symbol>
    <symbol id="trackpad" viewBox="0 0 256 256">
      <g fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
        <rect x="35" y="45" width="186" height="166" rx="30"/>
        <path d="M76 128H180M153 101L180 128L153 155"/>
      </g>
    </symbol>
    <symbol id="workspace" viewBox="0 0 256 256">
      <g fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
        <path d="M107 77V57Q107 43 121 43H204Q218 43 218 57V139Q218 153 204 153H183M149 177V199Q149 213 135 213H52Q38 213 38 199V117Q38 103 52 103H74M87 128H167M141 102L167 128L141 154"/>
      </g>
    </symbol>
    <symbol id="a" viewBox="0 0 256 256">
      <g fill="none" stroke="currentColor" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
        <path d="M49 209L125 43L201 209M61 162H131Q160 162 182 140L215 107M180 107H215V142"/>
      </g>
    </symbol>
  </defs>
  <rect width="1200" height="680" fill="#f5f6f2"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#172d32">
    <text x="48" y="53" font-size="12" letter-spacing="3">AEROSPACE GESTURES / IDENTITY EXPLORATION</text>
    <text x="48" y="107" font-size="36" font-weight="bold">Small gesture. Your command.</text>
    <text x="48" y="140" font-size="16" fill="#596b6d">Four directions. One palette. Designed to work without color.</text>
    <g fill="#dceee7">
      <rect x="48" y="184" width="258" height="258" rx="40"/>
      <rect x="330" y="184" width="258" height="258" rx="40"/>
      <rect x="612" y="184" width="258" height="258" rx="40"/>
      <rect x="894" y="184" width="258" height="258" rx="40"/>
    </g>
    <g color="#172d32">
      <use xlink:href="#swipe" x="81" y="217" width="192" height="192"/>
      <use xlink:href="#trackpad" x="363" y="217" width="192" height="192"/>
      <use xlink:href="#workspace" x="645" y="217" width="192" height="192"/>
      <use xlink:href="#a" x="927" y="217" width="192" height="192"/>
    </g>
    <g font-size="20" font-weight="bold">
      <text x="48" y="483">01 / Triple Swipe</text>
      <text x="330" y="483">02 / Trackpad Arrow</text>
      <text x="612" y="483">03 / Workspace Glide</text>
      <text x="894" y="483">04 / Gesture A</text>
    </g>
    <g font-size="14" fill="#596b6d">
      <text x="48" y="511">Touch trails become movement.</text>
      <text x="330" y="511">A direct nod to the hardware.</text>
      <text x="612" y="511">Move between your windows.</text>
      <text x="894" y="511">An initial with a swipe built in.</text>
    </g>
    <g color="#172d32">
      <use xlink:href="#swipe" x="48" y="550" width="16" height="16"/>
      <use xlink:href="#swipe" x="87" y="547" width="22" height="22"/>
      <use xlink:href="#swipe" x="130" y="542" width="32" height="32"/>
      <use xlink:href="#trackpad" x="330" y="550" width="16" height="16"/>
      <use xlink:href="#trackpad" x="369" y="547" width="22" height="22"/>
      <use xlink:href="#trackpad" x="412" y="542" width="32" height="32"/>
      <use xlink:href="#workspace" x="612" y="550" width="16" height="16"/>
      <use xlink:href="#workspace" x="651" y="547" width="22" height="22"/>
      <use xlink:href="#workspace" x="694" y="542" width="32" height="32"/>
      <use xlink:href="#a" x="894" y="550" width="16" height="16"/>
      <use xlink:href="#a" x="933" y="547" width="22" height="22"/>
      <use xlink:href="#a" x="976" y="542" width="32" height="32"/>
    </g>
    <path d="M48 607H1152" stroke="#d8ddda"/>
    <text x="48" y="640" font-size="12" fill="#596b6d">MENU-BAR STUDIES: 16 / 22 / 32 PX AT NATIVE SHEET SIZE</text>
    <text x="1152" y="640" text-anchor="end" font-size="12" fill="#596b6d">CONCEPTS ONLY / NO APP CHANGES</text>
  </g>
</svg>
