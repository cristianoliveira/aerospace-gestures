name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }} archive
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            macho_arch: arm64
            runner: macos-15
            triple: arm64-apple-macosx13.0
          - arch: amd64
            macho_arch: x86_64
            runner: macos-15-intel
            triple: x86_64-apple-macosx13.0
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version tag like v0.1.0; got $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Select supported Xcode toolchain
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          swift --version

      - name: Run canonical checks
        run: make check

      - name: Build and package release archive
        env:
          TARGET_TRIPLE: ${{ matrix.triple }}
          EXPECTED_ARCH: ${{ matrix.macho_arch }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail

          swift build --configuration release --triple "$TARGET_TRIPLE"
          bin_path="$(swift build --configuration release --triple "$TARGET_TRIPLE" --show-bin-path)"

          mkdir -p dist/payload
          cp "$bin_path/aerospace-gestures" dist/payload/aerospace-gestures
          chmod 755 dist/payload/aerospace-gestures

          actual_arch="$(lipo -archs dist/payload/aerospace-gestures)"
          if [[ "$actual_arch" != "$EXPECTED_ARCH" ]]; then
            echo "Expected $EXPECTED_ARCH binary; got $actual_arch" >&2
            exit 1
          fi

          archive="dist/aerospace-gestures-${GITHUB_REF_NAME}-darwin-${PACKAGE_ARCH}.tar.gz"
          python3 - "$archive" dist/payload/aerospace-gestures <<'PY'
          import gzip
          import sys
          import tarfile

          archive_path, binary_path = sys.argv[1:]
          with open(archive_path, "wb") as archive_file:
              with gzip.GzipFile(
                  filename="", fileobj=archive_file, mode="wb", mtime=0, compresslevel=9
              ) as compressed:
                  with tarfile.open(
                      fileobj=compressed, mode="w", format=tarfile.USTAR_FORMAT
                  ) as archive:
                      entry = archive.gettarinfo(binary_path, arcname="aerospace-gestures")
                      entry.uid = entry.gid = 0
                      entry.uname = entry.gname = ""
                      entry.mtime = 0
                      entry.mode = 0o755
                      with open(binary_path, "rb") as binary_file:
                          archive.addfile(entry, binary_file)
          PY

          entries="$(tar -tzf "$archive")"
          if [[ "$entries" != "aerospace-gestures" ]]; then
            echo "Unexpected archive contents: $entries" >&2
            exit 1
          fi

          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          tar -xzf "$archive" -C "$verify_dir"
          packaged_binary="$verify_dir/aerospace-gestures"
          test -f "$packaged_binary"
          test ! -L "$packaged_binary"

          packaged_arch="$(lipo -archs "$packaged_binary")"
          if [[ "$packaged_arch" != "$EXPECTED_ARCH" ]]; then
            echo "Expected extracted $EXPECTED_ARCH binary; got $packaged_arch" >&2
            exit 1
          fi
          "$packaged_binary" --help >/dev/null

          packaged_version="$($packaged_binary --version)"
          expected_version="${GITHUB_REF_NAME#v}"
          if [[ "$packaged_version" != "$expected_version" ]]; then
            echo "Packaged binary --version ($packaged_version) does not match release tag ($GITHUB_REF_NAME);" \
              "bump CLIVersion.current in Sources/GestureCLIPolicy/CLIVersion.swift before tagging" >&2
            exit 1
          fi

      - name: Attest release archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release tag for changelog extraction
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum aerospace-gestures-*.tar.gz > SHA256SUMS

      - name: Extract changelog section for the release tag
        run: |
          scripts/extract-release-notes.sh "$GITHUB_REF_NAME" CHANGELOG.md > dist/release-notes.md
          echo "Release notes:"; cat dist/release-notes.md

      - name: Publish release assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/aerospace-gestures-*.tar.gz \
            dist/SHA256SUMS \
            --repo "$GH_REPO" \
            --verify-tag \
            --notes "$(cat dist/release-notes.md)" \
            --generate-notes
